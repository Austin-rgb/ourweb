# CI for C++ / CMake project (gcc and clang)
# - Matrix builds for gcc and clang
# - CMake configure / build / ctest
# - Cache build artifacts and ccache
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

name: CI

jobs:
  build:
    name: Build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure CMake available
        uses: lukka/get-cmake@v3
        with:
          cmake-version: "latest"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          else
            sudo apt-get install -y gcc g++
          fi

      - name: Configure compiler environment variables
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
          echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV
        shell: bash

      - name: Cache build and ccache
        uses: actions/cache@v4
        with:
          path: |
            build
            .ccache
          key: ${{ runner.os }}-cmake-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX}
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}

      - name: Build
        run: cmake --build build -- -j $(nproc)

      - name: Run tests
        run: |
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No tests configured (no CTestTestfile.cmake found)"
          fi
